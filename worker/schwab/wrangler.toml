name = "size-calc-schwab"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# The app lives at https://shwing-trader.aolfat.workers.dev/ (../app/README.md).
# Redeploy only once the Schwab portal's callback says the same address and the app is Ready For Use again.
# must match the callback URL in your Schwab app exactly (scheme, host, port, path, trailing slash)
SCHWAB_CALLBACK_URL = "https://shwing-trader.aolfat.workers.dev/"
# pages allowed to call this worker from a browser, comma separated
# aolfat.github.io stays only until the move is done: remove it once the repo is private and Pages is off.
ALLOWED_ORIGINS = "https://shwing-trader.aolfat.workers.dev,https://aolfat.github.io,http://localhost:8765"

# secrets, never in this file:
#   npx wrangler secret put SCHWAB_APP_KEY
#   npx wrangler secret put SCHWAB_APP_SECRET
